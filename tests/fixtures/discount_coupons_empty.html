<!--
  REDACTED reproduction of a REAL response, live-read 2026-07-26 from
  GET /apa/selectListApa03020_n.do (할인쿠폰조회/등록) for an account holding no
  coupons. The live body was 77,056 bytes, almost all of it the shared MY SRT
  menu and footer; what is reproduced here is the content region's SHAPE -- the
  element names, ids and classes the parser reads -- and nothing else.

  Two things it demonstrates that no flattened fixture would:

    * the list CONTAINER (ul.coupList) is rendered even when the account holds
      nothing, which is why the parser uses it as the page's identity marker
      rather than using the presence of a coupon;
    * a commented-out two-coupon designer TEMPLATE ships inside that same
      container, on the live page. The one below is written for this fixture:
      the six span CLASSES are the page's (they are the field names
      DiscountCoupon is built from), the numbers, rates and dates are synthetic
      stand-ins chosen to look like real ones. That plausibility is the point --
      a parser that turned the comment into two coupons would look correct on
      every hand-built fixture and be wrong on the real page. html.parser hands
      a comment to handle_comment as one opaque string and never parses markup
      inside it.

  The registration form is kept because its two field names are part of the
  request. The trailing script is NOT the page's: the live page carries a
  couponReg() handler and this fixture replaces it with a plain record of the
  facts that handler is the sole evidence for -- the route, the JSON dataType,
  the two reply keys (resultMap[0].RTNCD / .MSG) and the two client-side
  refusals. All of it is 0-hit across the 21,673 files of the v2.0.41 offline
  bundle, which knows no /arb/ route at all. The parser must still ignore every
  bit of it, and a test asserts that reading this page issues no POST.

  What the bundle DOES corroborate is the vocabulary either side of the wire:
  js/common/messages.js:111-113 carries mysrt006 ("할인쿠폰번호를 입력하여
  주십시오."), mysrt007 ("할인쿠폰 비밀번호를 입력하여 주십시오.") and mysrt008
  ("쿠폰등록 요청을 완료하였습니다..."), which is why the client-side validation
  is restated in coupon_registration_payload rather than invented.
-->
