<!--
  SYNTHETIC, and labelled so for the same reason as discount_coupons_held.html.

  No account this project can read holds a 공공할인, so an APPROVED 할인 승차권
  page has never been seen. What this changes relative to its live sibling is
  exactly one thing and nothing else: two of the eight flags carry "Y".

  It is therefore a test of THIS LIBRARY's reading of the flags, not of the
  server's populated shape. Deliberately NOT invented here: the values the
  branch bodies would carry for an approved discount (PBL_DISC_CD, PBL_DISC_NM,
  PBL_DISC_MG_NO) and the 대상확인일 / 유효기간 dates. Those stay empty, exactly as
  the live page rendered them, because filling them in would be inventing a
  shape and then testing against the invention.

  Slots 1 and 6 are the pair chosen on purpose: 다자녀 (01) and 3세대 동행할인 (06)
  are the two the app refuses for a party under three, and 06 is a code whose
  slot number differs from its position in any list of "the approved ones".
-->
<div data-role="page" id="ara0101v_page" class="jqm-demos">
	<div data-role="header" class="type2 ui-header" role="banner" id="srtContents">
		<h1 class="ui-title" role="heading" aria-level="1">할인 승차권</h1>
	</div>

	<script language="JavaScript">
		var contextPath = "";

		/* The same fixture-written script as public_discount_none.html carries,
		   differing in the one way this whole file differs: slots 1 and 6 say
		   "Y". See that file for what each part of it is reproducing. */

		var data1Check="Y";
		var data2Check="";
		var data3Check="";
		var data4Check="";
		var data5Check="";
		var data6Check="Y";
		var data7Check="";
		var data8Check="";

		if (data1Check != "Y" && data2Check != "Y" && data3Check != "Y"
				&& data4Check != "Y" && data5Check != "Y" && data6Check != "Y"
				&& data7Check != "Y" && data8Check != "Y") {
			$("#inquiry1").hide();
			srtAlertBoxDivShow("알림", Sr.msgs.notice006, null, "gotoMain();");
		} else {
			//다자녀(01)와 임산부(02)가 신청이 승인된 경우,최근에 신청한 데이터로 출력해줌
			if (data1Check == "Y") { $("#PBL_DISC_CD").val(""); $("#PBL_DISC_NM").val(""); $("#PBL_DISC_MG_NO").val(""); }
			$("#TGT_DTRM_YN").val("Y");
		}

		var fixtureAra10131Navigation = {
			trigger: "goSubmit",
			form: "#rsvForm",
			formMethod: "get",
			retargetedTo: "/ara/selectListAra10131_n.do",
			queueGate: "NetFunnel_Action act_10, then the form submits"
		};
	</script>

	<div role="main" class="ui-content" data-ajax="false">
		<form id="rsvForm" name="rsvForm" method="get" data-ajax="false">
			<input type="hidden" name="jobId" id="jobId" value="1101"/>
			<input type="hidden" name="totPrnb" id="totPrnb" value="1" />
			<input type="hidden" name="dcntKndCd" value="" />
			<input type="hidden" name="PBL_DISC_CD" id="PBL_DISC_CD" value=""/>
			<input type="hidden" name="PBL_DISC_NM" id="PBL_DISC_NM" value=""/>
			<input type="hidden" name="PBL_DISC_MG_NO" id="PBL_DISC_MG_NO" value=""/>
			<input type="hidden" name="TGT_DTRM_YN" id="TGT_DTRM_YN" value=""/>
		</form>
	</div>
</div>
