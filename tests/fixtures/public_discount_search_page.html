<!--
  REDACTED excerpt of a REAL response, live-read 2026-07-26 from
  GET /ara/selectListAra10131_n.do (할인 승차권 조회결과) for an account approved
  for no 공공할인. The live body was 142,594 bytes; this keeps the one part the
  builder and the parser rest on and drops the shared chrome. The member number
  and the two JSESSIONID echoes the page prints in its own user map are removed.

  THIS PAGE IS THE ONLY EVIDENCE FOR THE 할인 승차권 SEARCH REQUEST.

  #seatSearchForm below IS the ajax body: its twenty-three field names and its
  nine server-rendered values are reproduced exactly, because they are the
  request. Note what is ABSENT: no netfunnelKey (the queue gate on this route is
  on the page navigation, not on the request -- the page calls NetFunnel_Complete
  on load, having already passed act_10 to get here), and no psgTpCd /
  psgInfoPerPrnb at all -- the ajax carries psgNum, the head count, and nothing
  else about the party.

  THE SCRIPT BELOW IS NOT THE PAGE'S. The live page carries three handlers --
  onload(), searchList() and innerHtml() -- and what they establish is recorded
  as a plain data record instead, because it is the names that are evidence:

    * searchList() is what actually fetches the rows: a POST back to the SAME
      path with dataType:"json", reading data.resultMap[0].strResult,
      data.trainListMap and data.dsCmdMap.gdNo. Paging is the gdNo CURSOR fed
      back in, not the dptTm bump the ordinary search uses, and the more-pages
      flag rides the FIRST ROW (trainListMap[0].fllwPgExt) rather than the
      metadata row;
    * innerHtml() matters only for its two discount columns, gnrmBkclDcntRt and
      sprmBkclDcntRt -- 0-hit in the v2.0.41 bundle and absent from every
      ordinary-search row captured here. A rate below 1 means "no discount on
      this train"; otherwise the page prints parseInt(rate) + "% 할인". Its
      parameter is still named dsOutputTemp, which is the clearest statement
      available that these are the ordinary search's rows in a differently-named
      container.

  WHAT THIS PAGE DOES NOT SHOW, and no page here can: a reply. Every hydration
  slot the page's onload() fills and all three pblDisc* inputs came back EMPTY,
  and identical, across four live GET probes with wildly different query strings
  (a full 146-field journey, that journey with PBL_DISC_CD="04", a bare `?type=`,
  and a de-duplicated journey). The four bodies differed only in the session id.
  That is why the GET half of this route is registered nowhere.
-->
